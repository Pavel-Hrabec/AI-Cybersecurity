<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Traditional SOC operating model and role relationships</title>
  <desc id="desc">SOC leadership governs tiered operations. Architecture guides operations and engineering. Specialist capabilities support all tiers. Confirmed incidents activate incident response and digital forensics.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18364b" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#567086"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#102f41}.subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#52677a}
      .h{font:700 21px 'Segoe UI',Arial,sans-serif}.t{font:400 16px 'Segoe UI',Arial,sans-serif}.label{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px}
      .white{fill:#fff}.dark{fill:#15384d}.muted{fill:#52677a}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#fff"/>
  <text x="70" y="62" class="title">How traditional SOC roles work together</text>
  <text x="70" y="94" class="subtitle">Leadership sets direction; operations, engineering, specialists and responders form one feedback system</text>

  <g filter="url(#shadow)">
    <rect x="480" y="130" width="640" height="80" rx="8" fill="#173f57"/>
    <text x="800" y="163" text-anchor="middle" class="h white">SOC DIRECTOR · SOC MANAGER</text>
    <text x="800" y="190" text-anchor="middle" class="t white">Mission · Risk priorities · Operating model · Staffing · Metrics · Governance</text>
  </g>
  <path d="M800 210V254" stroke="#567086" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="258" width="940" height="270" rx="8" fill="#f4f8fa" stroke="#bfd0dc"/>
    <text x="102" y="296" class="label dark">TIERED SOC OPERATIONS · ESCALATION PATH</text>
    <rect x="105" y="330" width="250" height="142" rx="8" fill="#2374a5"/>
    <text x="230" y="366" text-anchor="middle" class="h white">TIER 1</text>
    <text x="230" y="397" text-anchor="middle" class="t white">Monitor · Triage</text>
    <text x="230" y="423" text-anchor="middle" class="t white">Initial investigation</text>
    <text x="230" y="449" text-anchor="middle" class="t white">Document · Close / Escalate</text>
    <path d="M355 401H412" stroke="#567086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="415" y="330" width="250" height="142" rx="8" fill="#d0781f"/>
    <text x="540" y="366" text-anchor="middle" class="h white">TIER 2</text>
    <text x="540" y="397" text-anchor="middle" class="t white">Correlate · Investigate</text>
    <text x="540" y="423" text-anchor="middle" class="t white">Validate impact</text>
    <text x="540" y="449" text-anchor="middle" class="t white">Decide escalation / response</text>
    <path d="M665 401H722" stroke="#567086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="725" y="330" width="250" height="142" rx="8" fill="#b8433f"/>
    <text x="850" y="366" text-anchor="middle" class="h white">TIER 3</text>
    <text x="850" y="397" text-anchor="middle" class="t white">Expert analysis</text>
    <text x="850" y="423" text-anchor="middle" class="t white">Root cause · Attack path</text>
    <text x="850" y="449" text-anchor="middle" class="t white">Critical incident support</text>
    <rect x="105" y="486" width="870" height="27" rx="4" fill="#dce8ef"/>
    <text x="540" y="505" text-anchor="middle" class="label muted">SHIFT LEAD · WORKLOAD, ESCALATION &amp; HANDOVER  |  QUALITY ASSURANCE · CASE QUALITY, SLA &amp; PROCEDURE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1055" y="258" width="475" height="270" rx="8" fill="#edf5f2" stroke="#a9cabc"/>
    <text x="1087" y="296" class="label dark">CROSS-CUTTING TECHNICAL DIRECTION</text>
    <text x="1087" y="340" class="h dark">SECURITY / SOC ARCHITECT</text>
    <text x="1087" y="372" class="t muted">Target architecture · Telemetry strategy</text>
    <text x="1087" y="400" class="t muted">Integration standards · RBAC · Resilience</text>
    <line x1="1087" y1="428" x2="1498" y2="428" stroke="#bfd5cb"/>
    <text x="1087" y="463" class="h dark">ENGINEERING ENABLEMENT</text>
    <text x="1087" y="493" class="t muted">Detection · SIEM/platform · SOAR/automation</text>
  </g>
  <path d="M1055 390H1012" stroke="#567086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1012 422H1055" stroke="#567086" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="70" y="585" class="label dark">SPECIALIST CAPABILITIES · SUPPORT ANY TIER AND RETURN FINDINGS TO OPERATIONS &amp; ENGINEERING</text>
  <g filter="url(#shadow)">
    <rect x="70" y="610" width="270" height="126" rx="8" fill="#e9f3f9" stroke="#b9d2e1"/>
    <text x="205" y="650" text-anchor="middle" class="h dark">THREAT HUNTING</text><text x="205" y="680" text-anchor="middle" class="t muted">Hypotheses · Proactive search</text><text x="205" y="706" text-anchor="middle" class="t muted">Detection gaps · New incidents</text>
    <rect x="370" y="610" width="270" height="126" rx="8" fill="#f7f1e8" stroke="#dfc9a8"/>
    <text x="505" y="650" text-anchor="middle" class="h dark">THREAT INTELLIGENCE</text><text x="505" y="680" text-anchor="middle" class="t muted">Adversaries · TTPs · Context</text><text x="505" y="706" text-anchor="middle" class="t muted">Priorities · Detection input</text>
    <rect x="670" y="610" width="270" height="126" rx="8" fill="#edf5f2" stroke="#b8d2c7"/>
    <text x="805" y="650" text-anchor="middle" class="h dark">CLOUD &amp; IDENTITY</text><text x="805" y="680" text-anchor="middle" class="t muted">Domain investigation</text><text x="805" y="706" text-anchor="middle" class="t muted">Containment · Remediation</text>
    <rect x="970" y="610" width="270" height="126" rx="8" fill="#f6edf3" stroke="#d8bfd0"/>
    <text x="1105" y="650" text-anchor="middle" class="h dark">MALWARE &amp; FORENSICS</text><text x="1105" y="680" text-anchor="middle" class="t muted">Artifacts · Evidence</text><text x="1105" y="706" text-anchor="middle" class="t muted">Reverse engineering</text>
    <rect x="1270" y="610" width="260" height="126" rx="8" fill="#f1eef8" stroke="#c9c0dd"/>
    <text x="1400" y="650" text-anchor="middle" class="h dark">PURPLE TEAM</text><text x="1400" y="680" text-anchor="middle" class="t muted">Technique simulation</text><text x="1400" y="706" text-anchor="middle" class="t muted">Telemetry &amp; control validation</text>
  </g>
  <path d="M205 610V553H540V528" stroke="#7890a1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M505 610V567H540V528" stroke="#7890a1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M805 610V553H540V528" stroke="#7890a1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1105 610V553H1290V528" stroke="#7890a1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1400 610V553H1290V528" stroke="#7890a1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M850 528H955V797" stroke="#567086" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="970" y="782" class="t muted">Confirmed / major incident</text>
  <g filter="url(#shadow)">
    <rect x="280" y="805" width="1040" height="155" rx="8" fill="#6f2633"/>
    <text x="800" y="845" text-anchor="middle" class="h white">INCIDENT RESPONSE &amp; DFIR WORKSTREAM</text>
    <text x="800" y="880" text-anchor="middle" class="t white">Incident leadership · Containment · Eradication · Recovery · Evidence preservation</text>
    <text x="800" y="910" text-anchor="middle" class="t white">Root cause · Stakeholder coordination · Lessons learned · Detection and control improvement</text>
    <text x="800" y="942" text-anchor="middle" class="t white">IR coordinates the response; business and technology owners execute recovery actions</text>
  </g>
  <text x="70" y="1010" class="subtitle">Role boundaries vary by organization. One person may perform several roles; a role describes responsibility, not necessarily a dedicated position.</text>
</svg>
